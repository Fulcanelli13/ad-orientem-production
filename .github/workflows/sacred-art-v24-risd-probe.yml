name: Sacred Art V24 RISD original-photo API research (temporary, draft only)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/sacred-art-v24-risd-probe.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  risd:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Retrieve only official RISD public API records and inspect images
        run: python tools/probe-risd-dolci-exact-v24.py
      - name: Independently check exact object source and image hash evidence
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('.')
          j=json.loads((root/'app-data/sacred-art/staged-selected31-v24/risd-dolci-probe.v24.json').read_text())
          assert j['schema']=='ao.sacred-art.risd-dolci-exact-photo-probe.v24'
          assert j['no_site_or_prayer_change'] is True
          assert j['new_high_res_archive_count'] in (0,1)
          for x in j['upgrades']:
            assert x['review_artwork_id']=='tri-dolci' and x['accession']=='59.009'
            assert x['source_status'].startswith('ARCHIVED_RESEARCH_ONLY')
            assert min(x['source_dimensions'])>900
            for p,k in [('source_path','source_sha256'),('derivative_path','derivative_sha256')]:
              assert hashlib.sha256((root/x[p]).read_bytes()).hexdigest()==x[k]
          print('RISD source probe validated:',j['conclusion'])
          PY
          node tests/sacred-art-selected31-v23.mjs
          node tests/prayer-artwork-activation.mjs
      - name: Commit museum evidence only; never touch site or prayer-card registry
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-data/sacred-art/staged-selected31-v24/
          git diff --cached --quiet || git commit -m 'Sacred Art V24: archive RISD open API exact Dolci 59.009 source findings'
          git push origin HEAD:curation/selected31-gallery-reconciliation-v12
