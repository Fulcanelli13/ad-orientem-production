name: Sacred Art V20 source-photo upgrades (one-shot draft only)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/acquire-selected31-v20.yml
      - tools/acquire-selected31-upgrades-v20.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-v20-selected-sources
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Acquire improved owner-selected sources into research bank only
        run: python tools/acquire-selected31-upgrades-v20.py
      - name: Validate recorded hashes and existing 343-photo production contract
        run: |
          python - <<'PY'
          import pathlib,hashlib,json
          root=pathlib.Path('.')
          r=json.loads((root/'app-data/sacred-art/staged-selected31-v20/acquisition-results.v20.json').read_text())
          assert r['attempted']==3
          assert r['acquired_count']+r['held_count']==3
          assert r['acquired_count']>=1
          old=json.loads((root/'app-data/sacred-art/selected31-clearance-v19.json').read_text())
          eligible={x['review_artwork_id'] for x in old['records'] if x['disposition']=='HOLD_SOURCE_ONLY'}
          for x in r['records']:
            assert x['review_artwork_id'] in eligible
            assert x['status']=='SOURCE_ARCHIVE_ONLY__NO_SITE_OR_PRAYER_BINDING'
            assert x['quality_gate']=='RESOLUTION_UPGRADED__IMAGE_AND_REUSE_REVIEW_PENDING'
            assert max(x['source_dimensions'])>max(x['old_source_dimensions'])
            for k in ('source','derivative'):
              p=root/x[k+'_path']
              b=p.read_bytes()
              assert len(b)==x[k+'_bytes']
              assert hashlib.sha256(b).hexdigest()==x[k+'_sha256']
          gallery=json.loads((root/'site/gallery/catalogue.v1.json').read_text())
          prov=json.loads((root/'site/gallery/image-provenance.v1.json').read_text())
          assert gallery['counts']['total_records']==873
          assert gallery['counts']['distinct_locally_hosted_paintings']==343
          assert prov['local_image_count']==343
          print('V20',r['acquired_count'],'improvements,',r['held_count'],'held; production main unchanged')
          PY
          node tests/sacred-art-selected31-v19.mjs
          node tests/sacred-art-gallery.mjs
      - name: Commit archives and manifest only (not gallery publication)
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-data/sacred-art/staged-selected31-v20/
          git diff --cached --quiet || git commit -m 'Sacred Art V20: archive improved selected photographs with pending reuse gates'
          git push origin HEAD:curation/selected31-gallery-reconciliation-v12
