name: One-time bulk original-painting migration integrity review
on:
  push:
    branches: [feature/sacred-art-originals-bulk-transfer-20261116]
    paths: [.github/workflows/sacred-art-source-master-transfer-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source master hashes and unchanged selected prayer cards
        shell: bash
        run: |
          set -euo pipefail
          node --check site/gallery/gallery.js
          node tests/sacred-art-gallery.mjs
          node tests/production-shell.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-a1-donor-crosswalk.mjs
          node tests/angelus-part-artwork-coverage.mjs
