name: Sacred Art V18 selected source acquisition (draft-only)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/acquire-selected31-v18.yml
      - tools/acquire-selected31-sources-v18.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-v18-source-archive
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Acquire selected sources only
        run: python tools/acquire-selected31-sources-v18.py
      - name: Verify hashes, selection boundaries and current gallery integrity
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          root=pathlib.Path('.')
          a=json.loads((root/'app-data/sacred-art/staged-selected31-v18/acquisition-results.v18.json').read_text())
          assert a['attempted_selected_sources']==8
          assert a['acquired_count']+a['failed_acquisition_count']==8
          assert a['outstanding_poussin_count'] in (0,1)
          assert a['acquired_count']>=1
          selections=json.loads((root/'app-data/sacred-art/selected31-gallery-reconciliation-v12.json').read_text())
          ids={x['review_artwork_id'] for x in selections['records']}
          for record in a['records']:
              assert record['review_artwork_id'] in ids
              assert record['rights_gate'].startswith('SOURCE_ONLY__')
              assert record['status']=='SOURCE_ARCHIVE_ONLY__NO_PUBLIC_APP_OR_PRAYER_BINDING'
              for kind in ('source','derivative'):
                  f=root/record[kind+'_path']
                  assert f.exists()
                  b=f.read_bytes()
                  assert len(b)==record[kind+'_bytes']
                  assert hashlib.sha256(b).hexdigest()==record[kind+'_sha256']
          cat=json.loads((root/'site/gallery/catalogue.v1.json').read_text())
          assert cat['counts']['total_records']==873
          print('V18 validated',a['acquired_count'],'source photos; no public binding')
          PY
          node tests/sacred-art-gallery.mjs
          node tests/prayer-artwork-activation.mjs
      - name: Commit research sources only to draft PR
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-data/sacred-art/staged-selected31-v18/
          git diff --cached --quiet || git commit -m 'Sacred Art: archive verified V18 selected sources without publication'
          git push origin HEAD:curation/selected31-gallery-reconciliation-v12
