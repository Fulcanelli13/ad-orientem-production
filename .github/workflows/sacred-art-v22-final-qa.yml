name: Sacred Art V22 final 472-image production reconciliation QA (temporary)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/sacred-art-v22-final-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Check 31 selected review source hashes, licences and official production
        run: |
          node --version
          node --check site/gallery/gallery.js
          node tests/sacred-art-selected31-v19.mjs
          node tests/sacred-art-selected31-v20.mjs
          node tests/sacred-art-selected31-v21.mjs
          node tests/sacred-art-selected31-v22.mjs
          node tests/sacred-art-quality-wave06.mjs
          node tests/sacred-art-curated-wave05.mjs
          node tests/sacred-art-gallery.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/production-shell.mjs
      - name: Assert no 13 held photos enter deployable gallery
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const c=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-clearance-v22.json'));
          const h=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-held-remediation-v22.json'));
          const cat=JSON.parse(fs.readFileSync('site/gallery/catalogue.v1.json'));
          const prov=JSON.parse(fs.readFileSync('site/gallery/image-provenance.v1.json'));
          assert.equal(cat.counts.total_records,873);
          assert.equal(prov.local_image_count,472);
          assert.deepEqual(c.counts,{main_preserved:7,overlay_eligible:11,source_only_holds:13});
          assert.equal(h.records.length,13);
          assert.deepEqual(new Set(h.records.map(x=>x.review_artwork_id)),new Set(c.records.filter(x=>x.disposition==='HOLD_SOURCE_ONLY').map(x=>x.review_artwork_id)));
          console.log('V22 final: production 873/472, draft 883/483, selected 7/11/13, holds not published.');
          NODE
