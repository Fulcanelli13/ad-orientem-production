name: Sacred Art selected31 rebase QA (draft branch only)
on:
  push:
    branches:
      - curation/selected31-gallery-reconciliation-v12
    paths:
      - .github/workflows/selected31-rebase-qa.yml
      - site/gallery/**
      - app-data/sacred-art/staged-selected31-v13/**
      - app-data/sacred-art/staged-selected31-v14/**
      - app-data/sacred-art/staged-selected31-v15/**
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preserve latest production gallery contracts
        run: |
          node --check site/gallery/gallery.js
          node tests/sacred-art-gallery.mjs
      - name: Validate separate selected-image supplements and source SHA-256
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          b=pathlib.Path('.')
          main=json.loads((b/'site/gallery/catalogue.v1.json').read_text())
          img=json.loads((b/'site/gallery/image-provenance.v1.json').read_text())
          v13=json.loads((b/'site/gallery/selected31-reviewed-images.v13.json').read_text())
          v14=json.loads((b/'site/gallery/selected31-reviewed-images.v14.json').read_text())
          assert len(main['records'])==main['counts']['total_records']==873
          assert main['counts']['distinct_locally_hosted_paintings']==73
          assert len(img['sources'])==73
          assert len(v13['records'])==5 and len(v14['records'])==4
          assert len(v14['image_patches'])==1
          ids={x['id'] for x in main['records']}
          additions=v13['records']+v14['records']
          for r in additions:
            assert r['id'] not in ids
            assert r['id'].startswith('REVIEW31::')
            assert r['exact_prayer_cards']==[] and r['prayer_parts']==[]
            assert r['owner_selected_artwork'] is True
          p=v14['image_patches'][0]
          bloch=next(x for x in main['records'] if x['id']==p['id'])
          assert bloch['image'] is None and bloch['source_url']==p['expected_source_url']
          assert bloch['owner_selected_artwork'] is True
          # Verify all archive images, the locally hosted derivatives and source identities.
          allimages=[]
          for v in ('v13','v14','v15'):
            d=json.loads((b/f'app-data/sacred-art/staged-selected31-{v}/acquisition-results.{v}.json').read_text())
            assert len(d['records'])==({'v13':5,'v14':5,'v15':4}[v])
            for x in d['records']:
              for field in ('source','derivative'):
                f=b/x[field+'_path']
                assert f.exists()
                assert f.stat().st_size==x[field+'_bytes']
                assert hashlib.sha256(f.read_bytes()).hexdigest()==x[field+'_sha256']
              if v in ('v13','v14'): allimages.append(x['review_artwork_id'])
          assert len(allimages)==10
          for overlay in (v13,v14):
            for p in overlay['provenance']:
              f=b/p['gallery_file']
              assert f.exists() and f.stat().st_size==p['derivative_bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==p['derivative_sha256']
          low={x['review_artwork_id'] for x in v14['provenance'] if x['quality_gate']=='PREVIEW_ONLY'}
          assert low=={'cana-francken','cana-vermeyen'}
          js=(b/'site/gallery/gallery.js').read_text()
          assert 'selected31-reviewed-images.v13.json' in js and 'selected31-reviewed-images.v14.json' in js
          print('PASSED: 873 canonical records preserved, 10 images, 9 new review IDs, 1 safe Bloch patch')
          PY
