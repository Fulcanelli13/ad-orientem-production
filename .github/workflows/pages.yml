name: Publish Ad Orientem production

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  publish:
    name: Validate and deploy curated site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out production source
        uses: actions/checkout@v4
      - name: Validate the foundation
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/styles.css
          test -s site/app.js
          grep -Fq 'AD ORIENTEM' site/index.html
          grep -Fq 'NOT YET TRANSFERRED' site/index.html
          node --check site/app.js
          node tests/production-shell.mjs
          # Explicit, reviewable allowlist: copy ONLY the four imported pure
          # Explore modules to the curated artifact, not the research tree.
          mkdir -p site/explore/core
          for file in heritage-map place-source-synopsis geo-provenance sacred-place-visual-fallback; do
            cp "src/find/$file.js" "site/explore/core/$file.js"
          done
          node --experimental-default-type=module --check site/explore.js
          node --experimental-default-type=module --check site/explore/model.js
          node --experimental-default-type=module tests/explore-selected-core.mjs
          node --experimental-default-type=module tests/production-explore.mjs
          if grep -Rni 'vercel' site/; then
            echo 'Vercel references are not allowed in the production site.' >&2
            exit 1
          fi
      - name: Capture mobile review screenshots
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Headless Chrome not preinstalled; screenshots skipped."
            exit 0
          fi
          mkdir -p screenshots
          for VIEW in "390 844 mobile-390" "320 700 mobile-320" "1280 900 desktop"; do
            read -r WIDTH HEIGHT LABEL <<< "$VIEW"
            timeout 35s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage               --hide-scrollbars --force-device-scale-factor=1 --virtual-time-budget=1500               --user-data-dir="$RUNNER_TEMP/ao-chrome-$LABEL"               --window-size="$WIDTH,$HEIGHT"               --screenshot="screenshots/$LABEL.png"               "file://$GITHUB_WORKSPACE/site/index.html" >/dev/null 2>&1 || true
            if [ -f "screenshots/$LABEL.png" ]; then
              echo "$LABEL: $(stat -c '%s bytes' "screenshots/$LABEL.png")"
            fi
          done
      - name: Attach viewport screenshots for visual acceptance
        uses: actions/upload-artifact@v4
        with:
          name: home-v9-viewport-review
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload curated site only
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
