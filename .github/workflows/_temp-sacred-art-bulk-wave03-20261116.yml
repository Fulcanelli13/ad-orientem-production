name: Temporary Sacred Art bulk 429 recovery and museum source inventory
on:
  push:
    branches:
      - feature/sacred-art-bulk-recovery-wave03-20261116
    paths:
      - .github/workflows/_temp-sacred-art-bulk-wave03-20261116.yml
permissions:
  contents: write
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install native image checks
        shell: bash
        run: python3 -m pip install --quiet Pillow==12.0.0
      - name: Inventory other owner-selected museum artworks and retry previous source rate limits
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/audit-bulk-gallery-museum-masters-20261116.py
          python3 -u tools/retry-commons-429-wave03-20261116.py
          python3 tools/finalize-sacred-art-wave03-20261116.py
          node tests/sacred-art-commons-wave03.mjs
          node tests/sacred-art-bulk-commons-batch02.mjs
          node tests/sacred-art-bulk-commons.mjs
          node tests/sacred-art-gallery.mjs
          node tests/sacred-art-san-polo.mjs
          node tests/sacred-art-devotional-recovery.mjs
          node tests/sacred-art-class-i-gallery.mjs
          node tests/sacred-art-class-i-sources.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          node tests/production-shell.mjs
          node --check site/gallery/gallery.js
          git rm .github/workflows/_temp-sacred-art-bulk-wave03-20261116.yml
          git add app-data/sacred-art site/gallery tests
          git -c user.name='Ad Orientem Sacred Art Bulk Recovery' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Respect Commons throttling and reconcile all missing museum artworks'
          git push origin HEAD:feature/sacred-art-bulk-recovery-wave03-20261116
