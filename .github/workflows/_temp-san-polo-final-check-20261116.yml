name: Temporary San Polo final premerge verification
on:
  push:
    branches:
      - feature/san-polo-14-gallery-migration-20261116
    paths:
      - .github/workflows/_temp-san-polo-final-check-20261116.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify gallery, licence, prayer integrity and source proofs
        run: |
          set -euo pipefail
          node tests/sacred-art-san-polo.mjs
          node tests/sacred-art-gallery.mjs
          node tests/sacred-art-class-i-sources.mjs
          node tests/production-shell.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          node --check site/gallery/gallery.js
          git rm .github/workflows/_temp-san-polo-final-check-20261116.yml
          git -c user.name='Ad Orientem CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove temporary verified San Polo migration gate'
          git push origin HEAD:feature/san-polo-14-gallery-migration-20261116
