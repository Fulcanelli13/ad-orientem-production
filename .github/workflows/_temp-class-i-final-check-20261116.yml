name: Temporary Class I final source verification
on:
  push:
    branches:
      - feature/class-i-2026-gallery-link-20261116
    paths:
      - .github/workflows/_temp-class-i-final-check-20261116.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Independently validate dated Class I exact originals and all gallery contracts
        shell: bash
        run: |
          set -euo pipefail
          node tests/sacred-art-class-i-gallery.mjs
          node tests/sacred-art-class-i-sources.mjs
          node tests/sacred-art-devotional-recovery.mjs
          node tests/sacred-art-san-polo.mjs
          node tests/sacred-art-gallery.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          node tests/production-shell.mjs
          node --check site/gallery/gallery.js
          git rm .github/workflows/_temp-class-i-final-check-20261116.yml
          git -c user.name='Ad Orientem CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove temporary Class I gallery verification workflow'
          git push origin HEAD:feature/class-i-2026-gallery-link-20261116
