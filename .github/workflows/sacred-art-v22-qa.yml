name: Sacred Art V22 exact selected photo rights and QA (temporary)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/sacred-art-v22-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify source hashes, original identity and license credits, current production gallery
        run: |
          node --version
          node --check site/gallery/gallery.js
          node tests/sacred-art-selected31-v19.mjs
          node tests/sacred-art-selected31-v20.mjs
          node tests/sacred-art-selected31-v21.mjs
          node tests/sacred-art-selected31-v22.mjs
          node tests/sacred-art-curated-wave05.mjs
          node tests/sacred-art-selected-museum-wave04.mjs
          node tests/sacred-art-gallery.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/production-shell.mjs
      - name: Verify all 13 held original sources are archived and absent from public staging
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const x=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-clearance-v22.json'));
          const h=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-held-remediation-v22.json'));
          const cat=JSON.parse(fs.readFileSync('site/gallery/catalogue.v1.json'));
          const provenance=JSON.parse(fs.readFileSync('site/gallery/image-provenance.v1.json'));
          assert.equal(cat.records.length,873);
          assert.equal(provenance.local_image_count,467);
          assert.deepEqual(x.counts,{main_preserved:7,overlay_eligible:11,source_only_holds:13});
          assert.equal(h.records.length,13);
          assert.deepEqual(new Set(h.records.map(z=>z.review_artwork_id)),new Set(x.records.filter(z=>z.disposition==='HOLD_SOURCE_ONLY').map(z=>z.review_artwork_id)));
          for(const held of h.records) {
            assert(fs.existsSync(held.source_path));
            assert(held.hold_status==='SOURCE_ONLY__NOT_PUBLICATION_AUTHORIZED');
            assert(held.no_owner_permission_or_fee_requested===true);
          }
          console.log('13 held archived; 11 draft candidate photos; 7 live originals; proposed 883 records / 478 hosted paintings');
          NODE
