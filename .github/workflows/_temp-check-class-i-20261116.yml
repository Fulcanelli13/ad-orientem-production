name: Temporary Class I archive regression check
on:
  push:
    branches:
      - feature/sacred-art-class-i-source-recovery-20261116
    paths:
      - .github/workflows/_temp-check-class-i-20261116.yml
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify unchanged gallery plus three exact legacy source files
        shell: bash
        run: |
          set -euo pipefail
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          node tests/sacred-art-gallery.mjs
          node tests/sacred-art-class-i-sources.mjs
          test "$(find app-data/sacred-art/source-masters -maxdepth 1 -name '*.jpg' | wc -l)" -eq 54
          test "$(find .github/workflows -maxdepth 1 -name 'pages.yml' | wc -l)" -eq 1
          git rm .github/workflows/_temp-check-class-i-20261116.yml
          git -c user.name='Ad Orientem CI' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Remove completed temporary Class I archive verification workflow'
          git push origin HEAD:feature/sacred-art-class-i-source-recovery-20261116
