name: Temporary Class I exact gallery binding
on:
  push:
    branches:
      - feature/class-i-2026-gallery-link-20261116
    paths:
      - .github/workflows/_temp-class-i-gallery-20261116.yml
permissions:
  contents: write
jobs:
  link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Bind exact previously released Class I photo originals
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/link-class-i-gallery-20261116.py
          node --check site/gallery/gallery.js
          node tests/sacred-art-gallery.mjs
          node tests/sacred-art-san-polo.mjs
          node tests/sacred-art-devotional-recovery.mjs
          node tests/sacred-art-class-i-sources.mjs
          node tests/production-shell.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          git rm .github/workflows/_temp-class-i-gallery-20261116.yml
          git add site/gallery app-data/sacred-art/class-i-gallery-link-20261116.v1.json app-data/sacred-art/README.md tests/sacred-art-gallery.mjs tests/sacred-art-san-polo.mjs tests/sacred-art-devotional-recovery.mjs tests/sacred-art-class-i-sources.mjs
          git -c user.name='Ad Orientem Sacred Art Migration' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Display three previously released Class I Calendar paintings'
          git push origin HEAD:feature/class-i-2026-gallery-link-20261116
