name: Temporary Sacred Art 182-photo exact-source resolution recovery
on:
  push:
    branches:
      - feature/sacred-art-institutional-resolution-wave06-20261116
    paths:
      - .github/workflows/_temp-quality-wave06-import.yml
permissions:
  contents: write
jobs:
  qualify-and-acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install lossless image identification and controlled conversion
        run: python3 -m pip install --quiet Pillow==12.0.0
      - name: Source-check 182 quality holds and acquire high-resolution exact paintings in bulk
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/recover-resolution-held-art-wave06-20261116.py
          python3 tools/finalize-quality-wave06-20261116.py
          node tests/sacred-art-quality-wave06.mjs
          node tests/sacred-art-curated-wave05.mjs
          node tests/sacred-art-selected-museum-wave04.mjs
          node tests/sacred-art-commons-wave03.mjs
          node tests/sacred-art-bulk-commons-batch02.mjs
          node tests/sacred-art-bulk-commons.mjs
          node tests/sacred-art-gallery.mjs
          node tests/sacred-art-san-polo.mjs
          node tests/sacred-art-devotional-recovery.mjs
          node tests/sacred-art-class-i-gallery.mjs
          node tests/sacred-art-class-i-sources.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          node tests/production-shell.mjs
          node --check site/gallery/gallery.js
          git rm .github/workflows/_temp-quality-wave06-import.yml
          git add app-data/sacred-art site/gallery tests
          git -c user.name='Ad Orientem Art Photo Source Research' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bulk reconcile 182 quality-held artworks and preserve exact high-res source images'
          git push origin HEAD:feature/sacred-art-institutional-resolution-wave06-20261116

# Retest immutable 182-source recovery after correcting historical assertion indentation.
