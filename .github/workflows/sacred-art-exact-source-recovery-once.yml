name: One-time exact source-photo recovery integrity verification
on:
  push:
    branches: [feature/sacred-art-recover-40-source-photos-20261116]
    paths: [.github/workflows/sacred-art-exact-source-recovery-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Check 40 source file hashes and existing art/prayer invariants
        shell: bash
        run: |
          set -euo pipefail
          node --check site/gallery/gallery.js
          node tests/sacred-art-gallery.mjs
          node tests/production-shell.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-a1-donor-crosswalk.mjs
          node tests/angelus-part-artwork-coverage.mjs
