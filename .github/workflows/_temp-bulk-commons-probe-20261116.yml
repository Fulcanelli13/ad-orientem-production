name: Temporary Commons selected-photo metadata probe
on:
  push:
    branches:
      - feature/bulk-sacred-art-20261116
    paths:
      - .github/workflows/_temp-bulk-commons-probe-20261116.yml
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe Wikimedia Commons API for source-specific file rights metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.parse, json, traceback
          titles=["File:Maerten_de_Vos_-_The_Temptation_of_Saint_Anthony_the_Great.jpg","File:Gerard_Seghers_-_Ecstasy_of_Saint_Teresa.jpg","File:Jan_Janssens_-_The_Annunciation_-_S-91_-_Museum_of_Fine_Arts_Ghent_(MSK).jpg"]
          q=urllib.parse.urlencode(dict(action="query",prop="imageinfo",iiprop="url|size|mime|extmetadata",iiurlwidth=1400,titles="|".join(titles),format="json",formatversion="2"))
          u="https://commons.wikimedia.org/w/api.php?"+q
          for site in [u,"https://commons.wikimedia.org/wiki/Special:FilePath/Jan_Janssens_-_The_Annunciation_-_S-91_-_Museum_of_Fine_Arts_Ghent_(MSK).jpg?width=1400"]:
            try:
              with urllib.request.urlopen(urllib.request.Request(site,headers={"User-Agent":"AdOrientemResearch/0.1 (https://github.com/Fulcanelli13/ad-orientem-production; noncommercial-public-domain-source-verification)","Accept":"application/json,image/*;q=0.7"}),timeout=35) as x:
                b=x.read(13000)
                print(json.dumps({"url":site[:115],"status":x.status,"bytes_first":len(b),"content_type":x.headers.get("Content-Type"),"payload":b.decode("utf8","replace")[:900] if "json" in x.headers.get("Content-Type","") else str(b[:30])}))
            except Exception as e:
              print(json.dumps({"url":site[:115],"error":str(e)}))
          PY
