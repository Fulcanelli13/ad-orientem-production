name: Sacred Art V21 Francken institutional source recovery (draft-only)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/acquire-selected31-francken-v21.yml
      - tools/acquire-selected31-francken-v21.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-v21-francken
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: true}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Recover exact source, recording all unsuccessful attempts
        run: python tools/acquire-selected31-francken-v21.py
      - name: Check source integrity and unchanged baseline
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          b=pathlib.Path('.')
          r=json.loads((b/'app-data/sacred-art/staged-selected31-v21/acquisition-results.v21.json').read_text())
          assert r['attempted']==1
          assert r['acquired_count']+r['hold_count']==1
          for x in r['records']:
            assert x['accession']=='NM 7504'
            assert x['status']=='SOURCE_ARCHIVE_ONLY__NO_APP_OR_PRAYER_BINDING'
            assert x['rights_gate']=='GALLERY_PHOTO_SOURCE_SPECIFIC_RIGHTS_REVIEW'
            assert x['source_dimensions'][0]>=1750
            for k in ('source','derivative'):
              p=b/x[k+'_path'];s=p.read_bytes()
              assert len(s)==x[k+'_bytes'] and hashlib.sha256(s).hexdigest()==x[k+'_sha256']
          print('V21 sources:',r['acquired_count'],'held:',r['hold_count'])
          PY
          node tests/sacred-art-selected31-v20.mjs
          node tests/sacred-art-gallery.mjs
      - name: Commit research archive only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-data/sacred-art/staged-selected31-v21/
          git diff --cached --quiet || git commit -m 'Sacred Art V21: record NM 7504 source result without gallery publication'
          git push origin HEAD:curation/selected31-gallery-reconciliation-v12
