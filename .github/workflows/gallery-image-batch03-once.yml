name: One-time selected Sacred Art image transfer batch 03
on:
  push:
    branches: [feature/gallery-image-batch03-20261115]
    paths: [.github/workflows/gallery-image-batch03-once.yml]
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Recover pinned sources and create full-composition gallery derivatives
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet Pillow
          mkdir -p site/gallery/images app-data/sacred-art
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, urllib.request, subprocess, io
          from PIL import Image, ImageOps
          root=Path('.')
          out_dir=root/'site/gallery/images'
          source_dir=Path('/tmp/ao-gallery-source-batch03')
          source_dir.mkdir(parents=True,exist_ok=True)
          source_ref='14cd9d3ac11a6f27856f4740ae7c81e1b073bf1a'
          base='https://raw.githubusercontent.com/Fulcanelli13/ad-orientem/'+source_ref+'/'
          works=[
            dict(key='carracci',artwork_ids=['CANONICAL::met-438338'],source='https://upload.wikimedia.org/wikipedia/commons/d/de/The_Burial_of_Christ_MET_1998.188.jpg',origin='Wikimedia Commons donated by The Metropolitan Museum of Art; identical object 438338 / accession 1998.188',source_sha1='4fd1f84a555bba61f83e0a0363defd3f66023ce4',source_blob=None,filename='carracci-burial-met-438338-1592.webp',rights='Met-donated Commons CC0 1.0',evidence='https://commons.wikimedia.org/wiki/File:The_Burial_of_Christ_MET_1998.188.jpg'),
            dict(key='cavallino',artwork_ids=['CANONICAL::cma-143644'],source=base+'assets/prayer/released/cavallino-shepherds-original.jpg',origin='Fulcanelli13/ad-orientem@'+source_ref+':assets/prayer/released/cavallino-shepherds-original.jpg',source_blob='de079cefeb7af4b5a1dd82f1b3d400d240a815f6',filename='cavallino-shepherds-cma-1968-100-2000.webp',rights='Cleveland Museum of Art CC0',evidence='https://www.clevelandart.org/art/1968.100'),
            dict(key='girardin',artwork_ids=['CANONICAL::cma-136507','released-photo:girardin'],source=base+'assets/prayer/released/girardin-trinity-original.jpg',origin='Fulcanelli13/ad-orientem@'+source_ref+':assets/prayer/released/girardin-trinity-original.jpg',source_blob='ee2778b57a6df0dc03f8ce0b569333228c896f6a',filename='girardin-trinity-cma-1960-79-2000.webp',rights='Cleveland Museum of Art CC0',evidence='https://www.clevelandart.org/art/1960.79'),
            dict(key='latour',artwork_ids=['CANONICAL::met-436839'],source=base+'assets/prayer/released/latour-penitent-magdalen-met-original.jpg',origin='Fulcanelli13/ad-orientem@'+source_ref+':assets/prayer/released/latour-penitent-magdalen-met-original.jpg',source_blob='19dcce15cd0916d57f3eae246bfe487979615e76',filename='latour-penitent-magdalen-met-436839-2000.webp',rights='Metropolitan Museum of Art public-domain Open Access / CC0',evidence='https://www.metmuseum.org/art/collection/search/436839'),
            dict(key='saraceni',artwork_ids=['PRAYER::saints--saraceni'],source=base+'assets/home/class-i-2026/saraceni-paradise-met-1971-93-original.jpg',origin='Fulcanelli13/ad-orientem@'+source_ref+':assets/home/class-i-2026/saraceni-paradise-met-1971-93-original.jpg',source_blob='dcff19a6efaf2e7a6c71bca7f362119ac6af342b',filename='saraceni-paradise-met-437607-2000.webp',rights='Metropolitan Museum of Art Open Access / CC0',evidence='https://www.metmuseum.org/art/collection/search/437607')
          ]
          rows=[]
          for work in works:
            raw_path=source_dir/(work['key']+'.jpg')
            req=urllib.request.Request(work['source'],headers={'User-Agent':'AdOrientemArtArchive/1.0 (source verification; noncommercial research)'})
            with urllib.request.urlopen(req,timeout=90) as resp:
              raw_path.write_bytes(resp.read())
            raw=raw_path.read_bytes()
            assert raw[:2]==b'\xff\xd8', 'Downloaded source is not a JPEG: '+work['key']
            source_blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
            if work.get('source_blob'):
              assert source_blob == work['source_blob'], f"Research archive SHA mismatch for {work['key']}: {source_blob}"
            if work.get('source_sha1'):
              sha1=hashlib.sha1(raw).hexdigest()
              assert sha1 == work['source_sha1'], f"Commons source SHA mismatch for {work['key']}: {sha1}"
            with Image.open(io.BytesIO(raw)) as im:
              im.load()
              im=ImageOps.exif_transpose(im)
              source_dim=list(im.size)
              assert max(source_dim)>=1200, f"Too small source for {work['key']}: {source_dim}"
              if im.mode != 'RGB':
                im=im.convert('RGB')
              original_aspect=im.width/im.height
              if max(im.size)>2000:
                im.thumbnail((2000,2000),Image.Resampling.LANCZOS)
              assert abs((im.width/im.height)-original_aspect)<0.002, 'Unexpected composition alteration'
              dst=out_dir/work['filename']
              im.save(dst,format='WEBP',quality=87,method=6)
              result_dim=list(im.size)
            body=dst.read_bytes()
            assert body[:4]==b'RIFF' and body[8:12]==b'WEBP'
            row={k:v for k,v in work.items() if k not in ('source','source_blob','source_sha1')}
            row.update(source_sha256=hashlib.sha256(raw).hexdigest(),source_git_blob_sha=source_blob,source_bytes=len(raw),source_dimensions_px=source_dim,local_path='site/gallery/images/'+work['filename'],local_git_blob_sha=hashlib.sha1(b'blob '+str(len(body)).encode()+b'\0'+body).hexdigest(),local_sha256=hashlib.sha256(body).hexdigest(),local_bytes=len(body),local_dimensions_px=result_dim,original_preserved_in_research=True,no_crop=True,quality='FULL_COMPOSITION_GALLERY_WEBP_FROM_ARCHIVED_SOURCE',scope='GALLERY_ONLY_NO_NEW_PRAYER_ASSIGNMENT')
            rows.append(row)
            print('VERIFIED',work['key'],source_dim,'=>',result_dim,len(body),'bytes',flush=True)
          manifest={'schema':'ao.sacred-art.gallery-image-import.v1','batch':'2026-11-15-batch03','source_ref':source_ref,'policy':'Only owner-selected works already in 862-record registry. Keep original source bytes in research; gallery stores faithful uncropped WebP derivatives for mobile. No prayer-stage promotion.','sources':rows}
          (root/'app-data/sacred-art/gallery-image-import-batch03.v1.json').write_text(json.dumps(manifest,indent=2)+'\n')
          PY
          git add site/gallery/images/{carracci-burial-met-438338-1592,cavallino-shepherds-cma-1968-100-2000,girardin-trinity-cma-1960-79-2000,latour-penitent-magdalen-met-436839-2000,saraceni-paradise-met-437607-2000}.webp app-data/sacred-art/gallery-image-import-batch03.v1.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "Recover five selected gallery reproductions with source checksums"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Validate source hashes, gallery catalogue and preserved prayer contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check site/gallery/gallery.js
          node tests/sacred-art-gallery.mjs
          node tests/production-shell.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-a1-donor-crosswalk.mjs
          node tests/angelus-part-artwork-coverage.mjs
