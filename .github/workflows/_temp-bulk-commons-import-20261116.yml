name: Temporary bulk owner-approved Sacred Art import
on:
  push:
    branches:
      - feature/bulk-sacred-art-20261116
    paths:
      - .github/workflows/_temp-bulk-commons-import-20261116.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install native image validation and WebP conversion dependency
        shell: bash
        run: |
          python3 -m pip install --quiet Pillow==12.0.0
      - name: Process 491 selected originals and up to 180 Commons images in one bulk batch
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/bulk-import-selected-commons-20261116.py
          python3 tools/finalize-bulk-commons-20261116.py
          node tests/sacred-art-bulk-commons.mjs
          node tests/sacred-art-gallery.mjs
          node tests/sacred-art-san-polo.mjs
          node tests/sacred-art-devotional-recovery.mjs
          node tests/sacred-art-class-i-sources.mjs
          node tests/sacred-art-class-i-gallery.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          node tests/production-shell.mjs
          node --check site/gallery/gallery.js
          git rm .github/workflows/_temp-bulk-commons-probe-20261116.yml .github/workflows/_temp-bulk-commons-import-20261116.yml
          git add .github/workflows/pages.yml app-data/sacred-art site/gallery tests
          git -c user.name='Ad Orientem Sacred Art Bulk Import' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bulk release verified already-selected Commons paintings into permanent gallery'
          git push origin HEAD:feature/bulk-sacred-art-20261116
