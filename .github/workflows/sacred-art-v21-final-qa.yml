name: Sacred Art V21 final 467-image reconciliation QA (temporary)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/sacred-art-v21-final-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ensure current wave05 production plus V21 overlay and all 15 holds
        run: |
          node --version
          node --check site/gallery/gallery.js
          node tests/sacred-art-selected31-v19.mjs
          node tests/sacred-art-selected31-v20.mjs
          node tests/sacred-art-selected31-v21.mjs
          node tests/sacred-art-curated-wave05.mjs
          node tests/sacred-art-selected-museum-wave04.mjs
          node tests/sacred-art-gallery.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/production-shell.mjs
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const prov=JSON.parse(fs.readFileSync('site/gallery/image-provenance.v1.json'));
          const cat=JSON.parse(fs.readFileSync('site/gallery/catalogue.v1.json'));
          const c=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-clearance-v21.json'));
          const h=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-held-remediation-v21.json'));
          assert.equal(cat.counts.total_records,873);
          assert.equal(prov.local_image_count,467);
          assert.equal(cat.counts.distinct_locally_hosted_paintings,467);
          assert.deepEqual(c.counts,{main_preserved:7,overlay_eligible:9,source_only_holds:15});
          assert.equal(h.records.length,15);
          assert.deepEqual(new Set(h.records.map(x=>x.review_artwork_id)),new Set(c.records.filter(x=>x.disposition==='HOLD_SOURCE_ONLY').map(x=>x.review_artwork_id)));
          console.log('Final V21: canonical 873/467 preserved; draft proposes 881/476; 15 holds isolated.');
          NODE
