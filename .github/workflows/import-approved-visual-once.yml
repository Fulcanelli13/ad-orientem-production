# TEMPORARY: bounded one-time visual asset transfer. Remove after success.
name: Import approved Claude design assets (one-time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-approved-visual-once.yml'

permissions:
  contents: write

concurrency:
  group: approved-visual-assets-import
  cancel-in-progress: false

jobs:
  import:
    name: Import only hash-verified fonts and navigation assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Import allowlisted files and verify immutable Git object IDs
        run: python3 tools/import-approved-visual-assets.py
      - name: Commit vetted assets to this repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/assets/fonts site/assets/icons site/assets/brand
          if git diff --cached --quiet; then
            echo "No asset changes needed."
          else
            git commit -m "assets: vendor exact approved Claude fonts and owner navigation icons"
            git push origin HEAD:main
          fi
