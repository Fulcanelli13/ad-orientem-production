name: Sacred Art V26 exact Louvre photo source and 31-selection regression (temporary)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/sacred-art-v26-final-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: V19-V26 complete artwork/photo rights, gallery, production and prayer regression
        run: |
          node --version
          node --check site/gallery/gallery.js
          node tests/sacred-art-selected31-v19.mjs
          node tests/sacred-art-selected31-v20.mjs
          node tests/sacred-art-selected31-v21.mjs
          node tests/sacred-art-selected31-v22.mjs
          node tests/sacred-art-selected31-v23.mjs
          node tests/sacred-art-selected31-v24.mjs
          node tests/sacred-art-selected31-v25.mjs
          node tests/sacred-art-selected31-v26.mjs
          node tests/sacred-art-quality-wave06.mjs
          node tests/sacred-art-curated-wave05.mjs
          node tests/sacred-art-selected-museum-wave04.mjs
          node tests/sacred-art-gallery.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/production-shell.mjs
      - name: Strictly preserve eight Italian heritage holds, no default prayer images or deployed changes
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const selected=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-clearance-v26.json'));
          const holds=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-held-remediation-v26.json'));
          const rights=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-release-decision-v26.json'));
          const base=JSON.parse(fs.readFileSync('site/gallery/catalogue.v1.json'));
          const images=JSON.parse(fs.readFileSync('site/gallery/image-provenance.v1.json'));
          assert.deepEqual(selected.counts,{main_preserved:7,overlay_eligible:13,source_only_holds:11});
          assert.equal(holds.records.length,11);
          assert.equal(holds.records.filter(r=>r.rights_or_identity_lane.startsWith('IT_')).length,8);
          assert.equal(rights.counts.strong_photo_reuse_evidence,10);
          assert.equal(rights.counts.public_domain_mark_extra_review,3);
          assert.equal(base.counts.total_records,873);
          assert.equal(images.local_image_count,472);
          assert(selected.records.every(x=>x.automatic_prayer_card_assignment===false));
          console.log('V26 strict QA PASS — draft 885/485, live 873/472, original 31 7/13/11, 8 Italian holds preserved.');
          NODE
