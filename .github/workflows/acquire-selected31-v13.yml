name: Sacred Art selected-31 acquisition (staging only)
on:
  push:
    branches:
      - curation/selected31-gallery-reconciliation-v12
    paths:
      - .github/workflows/acquire-selected31-v13.yml
      - tools/acquire-selected31-open-images-v13.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sacred-art-v13-acquisition
  cancel-in-progress: false
jobs:
  acquire:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install single image dependency
        run: python -m pip install 'Pillow>=10,<13'
      - name: Acquire and verify exact museum objects, if not already archived
        run: |
          if [ -f app-data/sacred-art/staged-selected31-v13/acquisition-results.v13.json ]; then
            echo 'Using already validated institutional image sources'
          else
            python tools/acquire-selected31-open-images-v13.py
          fi
      - name: Validate every staged source and derivative hash
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          root=pathlib.Path('.')
          path=root/'app-data/sacred-art/staged-selected31-v13/acquisition-results.v13.json'
          report=json.loads(path.read_text())
          assert len(report['records'])==5
          assert len({x['review_artwork_id'] for x in report['records']})==5
          for r in report['records']:
              for kind in ('source','derivative'):
                  f=root/r[kind+'_path']
                  assert f.is_file()
                  assert hashlib.sha256(f.read_bytes()).hexdigest()==r[kind+'_sha256']
              assert r['publication_status']=='STAGED_ONLY_NOT_LIVE_NOT_PRAYER_APPROVED'
          print('All five image pairs, hash and scope checks pass')
          PY
      - name: Prepare five reviewed gallery assets without altering canonical registry
        run: python tools/stage-selected31-gallery-overlay-v13.py
      - name: Run original gallery contract and new supplement checks
        run: |
          node tests/sacred-art-gallery.mjs
          python - <<'PY'
          import hashlib,json,pathlib
          base=pathlib.Path('.')
          original=json.loads((base/'site/gallery/catalogue.v1.json').read_text())
          extra=json.loads((base/'site/gallery/selected31-reviewed-images.v13.json').read_text())
          assert original['counts']['total_records']==len(original['records'])==862
          assert len(extra['records'])==len(extra['provenance'])==5
          ids={a['id'] for a in original['records']}
          for r,p in zip(extra['records'],extra['provenance']):
              assert r['id'] not in ids and r['owner_selected_artwork']
              assert r['exact_prayer_cards']==[] and r['prayer_parts']==[]
              assert r['image']['usage']=='GALLERY_IMAGE_ONLY__PRAYER_QA_PENDING'
              f=base/p['gallery_file']
              assert f.exists() and f.stat().st_size==p['derivative_bytes']
              assert hashlib.sha256(f.read_bytes()).hexdigest()==p['derivative_sha256']
          assert 'selected31-reviewed-images.v13.json' in (base/'site/gallery/gallery.js').read_text()
          print('Canonical 862 preserved; five reviewed images source-validated')
          PY
      - name: Commit staged assets on current draft branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app-data/sacred-art/staged-selected31-v13/ site/gallery/selected31-reviewed-images.v13.json site/gallery/images/selected31-*.webp site/gallery/gallery.js site/gallery/README.md
          git diff --cached --quiet || git commit -m 'Sacred Art: stage five verified museum reproductions (not live)'
          git push origin HEAD:curation/selected31-gallery-reconciliation-v12
      - name: Retain validation report
        uses: actions/upload-artifact@v4
        with:
          name: sacred-art-selected31-v13-report
          path: app-data/sacred-art/staged-selected31-v13/acquisition-results.v13.json
          retention-days: 14
