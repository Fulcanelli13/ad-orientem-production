name: Sacred Art V19 reconciled source and gallery gate QA (temporary)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/sacred-art-v19-qa.yml
      - tests/sacred-art-selected31-v19.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Validate read-only production gallery and 31-source clearance
        run: |
          node --version
          node --check site/gallery/gallery.js
          node tests/sacred-art-selected31-v19.mjs
          node tests/sacred-art-gallery.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/production-shell.mjs
      - name: Confirm main source registry still pristine and rights-gated files are absent from site
        run: |
          test ! -e site/gallery/images/selected31-v14-bap-verrocchio-2000.webp
          test ! -e site/gallery/images/selected31-v14-cana-francken-2000.webp
          test ! -e site/gallery/images/selected31-v14-cana-vermeyen-2000.webp
          test -e app-data/sacred-art/staged-selected31-v14/bap-verrocchio-source.jpg
          test -e app-data/sacred-art/staged-selected31-v14/cana-francken-source.jpg
          test -e app-data/sacred-art/staged-selected31-v14/cana-vermeyen-source.jpg
