name: Temporary bulk 84 owner-curated Sacred Art import
on:
  push:
    branches:
      - feature/sacred-art-bulk-wave05-20261116
    paths:
      - .github/workflows/_temp-wave05-import.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install uncropped WebP photo conversion
        run: python3 -m pip install --quiet Pillow==12.0.0
      - name: Qualify 84 previously owner-curated exact source file pages in a bulk gallery pass
        shell: bash
        run: |
          set -euo pipefail
          python3 -u tools/import-owner-curated-wave05-20261116.py
          python3 tools/finalize-curated-wave05-20261116.py
          node tests/sacred-art-curated-wave05.mjs
          node tests/sacred-art-selected-museum-wave04.mjs
          node tests/sacred-art-commons-wave03.mjs
          node tests/sacred-art-bulk-commons-batch02.mjs
          node tests/sacred-art-bulk-commons.mjs
          node tests/sacred-art-gallery.mjs
          node tests/sacred-art-san-polo.mjs
          node tests/sacred-art-devotional-recovery.mjs
          node tests/sacred-art-class-i-gallery.mjs
          node tests/sacred-art-class-i-sources.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-part-artwork-coverage.mjs
          node tests/production-shell.mjs
          node --check site/gallery/gallery.js
          git rm .github/workflows/_temp-wave05-84-audit.yml .github/workflows/_temp-wave05-import.yml
          git add app-data/sacred-art site/gallery tests
          git -c user.name='Ad Orientem Sacred Art Acquisition' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Bulk import other historically approved curated Sacred Art photos with exact source hashes'
          git push origin HEAD:feature/sacred-art-bulk-wave05-20261116
