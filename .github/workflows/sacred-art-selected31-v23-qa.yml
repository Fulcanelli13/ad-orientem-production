name: Sacred Art V23 all-thirteen original photos visual rights audit QA (temporary)
on:
  push:
    branches: [curation/selected31-gallery-reconciliation-v12]
    paths:
      - .github/workflows/sacred-art-selected31-v23-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/curation/selected31-gallery-reconciliation-v12'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: V23 thirteen-source rights and quality audit regression (read-only)
        run: |
          node --version
          node --check site/gallery/gallery.js
          node tests/sacred-art-selected31-v19.mjs
          node tests/sacred-art-selected31-v20.mjs
          node tests/sacred-art-selected31-v21.mjs
          node tests/sacred-art-selected31-v22.mjs
          node tests/sacred-art-selected31-v23.mjs
          node tests/sacred-art-quality-wave06.mjs
          node tests/sacred-art-gallery.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/production-shell.mjs
      - name: Cross-check all 13 research-only holds against separate 11-image draft overlay
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const b=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-review-board-v23.json'));
          const s=JSON.parse(fs.readFileSync('app-data/sacred-art/selected31-clearance-v23.json'));
          assert.equal(b.active_holds.length,13);
          assert.equal(s.records.filter(x=>x.disposition==='DRAFT_GALLERY_ELIGIBLE').length,11);
          assert.equal(s.records.filter(x=>x.disposition==='CURRENT_MAIN_PRESERVE').length,7);
          assert.equal(s.records.filter(x=>x.disposition==='HOLD_SOURCE_ONLY').length,13);
          assert(!fs.existsSync('site/gallery/images/selected31-v23-bap-haarlem-sailko-2000.webp'));
          console.log('V23 confirmed: research only, no new gallery photo, prayer assignments or deployment changes');
          NODE
