name: One-time Sacred Art gallery batch 07 integrity validation
on:
  push:
    branches: [feature/gallery-image-batch07-20261115]
    paths: [.github/workflows/gallery-image-batch07-integrity-once.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate museum-image hashes and preserved prayer contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check site/gallery/gallery.js
          node tests/sacred-art-gallery.mjs
          node tests/production-shell.mjs
          node tools/validate-prayer-artwork-assets.mjs
          node tests/prayer-artwork-activation.mjs
          node tests/angelus-a1-donor-crosswalk.mjs
          node tests/angelus-part-artwork-coverage.mjs
